<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Control de Tienda</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#0f172a;--card:#1e293b;--card2:#273449;--tx:#e2e8f0;--mut:#94a3b8;--ac:#22c55e;--ac2:#38bdf8;--red:#ef4444;--yel:#f59e0b;--bd:#334155}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,Segoe UI,Roboto,sans-serif;padding-bottom:80px}
header{position:sticky;top:0;z-index:5;background:#0b1220;border-bottom:1px solid var(--bd);padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header h1{font-size:17px;margin:0;flex:1;min-width:140px}
.rate{font-size:12px;color:var(--mut);background:var(--card);padding:5px 10px;border-radius:999px;cursor:pointer}
nav{position:fixed;bottom:0;left:0;right:0;background:#0b1220;border-top:1px solid var(--bd);display:flex;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:9px 1px;font-size:10px;cursor:pointer}
nav button b{display:block;font-size:19px;font-weight:400}
nav button.on{color:var(--ac)}
main{max-width:980px;margin:0 auto;padding:14px}
h2{font-size:16px;margin:4px 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
.kpi small{color:var(--mut);display:block;font-size:12px}
.kpi b{font-size:22px}
.g{color:var(--ac)}.r{color:var(--red)}.y{color:var(--yel)}.m{color:var(--mut)}
input,select,textarea{width:100%;background:#0b1220;color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:9px;font:inherit}
label{font-size:12px;color:var(--mut);display:block;margin:8px 0 3px}
button.btn{background:var(--ac);color:#04210f;border:0;border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;font:inherit;font-weight:600}
button.btn.s{background:var(--card2);color:var(--tx)}
button.btn.d{background:var(--red);color:#fff}
button.btn.sm{padding:5px 9px;font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{flex:1;min-width:90px}
.row>.fix{flex:none;min-width:0}
table{width:100%;border-collapse:collapse}
td,th{padding:7px 6px;border-bottom:1px solid var(--bd);text-align:left;font-size:14px}
th{color:var(--mut);font-weight:500;font-size:12px}
td.n,th.n{text-align:right;white-space:nowrap}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 4px;border-bottom:1px solid var(--bd);cursor:pointer}
.item:last-child{border:0}
.tag{font-size:11px;background:var(--card2);padding:2px 8px;border-radius:999px;color:var(--mut)}
.modal{position:fixed;inset:0;background:#000a;z-index:20;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:14px}
.modal>div{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;width:100%;max-width:560px;margin:auto}
.modal h3{margin:0 0 6px}
.irow{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:6px;margin-bottom:6px}
@media(max-width:560px){.irow{grid-template-columns:1fr 1fr 1fr auto}.irow .nm{grid-column:1/-1}}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;cursor:pointer;border:1px solid var(--bd);margin:0 4px 4px 0;color:var(--mut)}
.pill.on{background:var(--ac);color:#04210f;border-color:var(--ac)}
.day{background:var(--card2);padding:6px 10px;border-radius:8px;margin:10px 0 4px;font-weight:600;font-size:13px}
.ths{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.th{position:relative}.th img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--bd);cursor:pointer}.th b{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;border-radius:99px;width:20px;height:20px;text-align:center;font-size:12px;line-height:20px;cursor:pointer}
.viewer{position:fixed;inset:0;background:#000e;z-index:40;display:flex;align-items:center;justify-content:center;padding:10px}.viewer img{max-width:100%;max-height:100%;border-radius:8px}
.bc{display:flex;gap:6px;align-items:flex-end;margin:10px 0 4px}.bc>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:11px;color:var(--mut);min-width:0}.bc i{display:block;width:100%;background:var(--ac2);border-radius:6px 6px 0 0;min-height:2px}.bc .best i{background:var(--ac)}.bc .best b{color:var(--ac)}.bc span{white-space:nowrap}.bc.sm{gap:3px}.bc.sm span{font-size:9px}
img.cmp{max-width:100%;border-radius:8px;margin-top:6px}
.bar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac2)}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#000;color:#fff;padding:9px 16px;border-radius:99px;z-index:30;font-size:13px}
@media print{header,nav,.noprint{display:none!important}body{background:#fff;color:#000}.card{border-color:#999;background:#fff}}
</style>
</head>
<body>
<header>
  <h1 id="storeName">🛍️ Control de Tienda</h1>
  <span class="rate" id="rateTag" onclick="go('ajustes')"></span><span class="rate" onclick="calcForm()">🧮 Calculadora</span>
</header>
<main id="app"></main>
<nav id="nav"></nav>
<div id="modalRoot"></div>

<script src="tasa.js"></script>
<script>
'use strict';
/* ===== Utilidades ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const r2=n=>Math.round((+n||0)*100)/100;
const fmt=n=>'$'+r2(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtBs=n=>'Bs '+r2(n).toLocaleString('es-VE',{minimumFractionDigits:2,maximumFractionDigits:2});
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const DIAS=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const parseISO=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const fdate=s=>{const d=parseISO(s);return DIAS[d.getDay()]+' '+d.getDate()+'/'+(d.getMonth()+1)+'/'+d.getFullYear()};
const fshort=s=>{const d=parseISO(s);return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear()};
const monthKey=s=>s.slice(0,7);
function weekStart(iso){const d=parseISO(iso);const k=(d.getDay()+6)%7;d.setDate(d.getDate()-k);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}

/* ===== Datos (IndexedDB con respaldo en localStorage) ===== */
const DEF_CATS=['Electrónicos','Teléfonos','Relojes','Planchas','Perfumes','Ropa','Trajes de baño','Calzado','Accesorios','Ropa interior','Otros'];
const METHODS=['Efectivo $','Zelle','Pago móvil','Transferencia','Binance','Otro'];
let S={clients:[],products:[],sales:[],payments:[],closes:[],settings:{store:'Mi Tienda',rate:0,markup:0.5,cats:DEF_CATS.slice(),rateDate:''}};
let db=null;
function openDB(){return new Promise(res=>{try{const q=indexedDB.open('control_tienda',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>{db=q.result;res()};q.onerror=()=>res()}catch(e){res()}})}
function idbGet(){return new Promise(res=>{if(!db)return res(null);const r=db.transaction('kv').objectStore('kv').get('state');r.onsuccess=()=>res(r.result||null);r.onerror=()=>res(null)})}
function idbSet(v){return new Promise(res=>{if(!db)return res();const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,'state');t.oncomplete=()=>res();t.onerror=()=>res()})}
let saveT;function save(){clearTimeout(saveT);saveT=setTimeout(async()=>{await idbSet(S);try{localStorage.setItem('ct_backup_nophotos',JSON.stringify({...S,payments:S.payments.map(p=>({...p,photo:undefined,photos:undefined})),closes:S.closes.map(c=>({...c,photos:undefined}))}))}catch(e){}},150)}
async function load(){await openDB();let d=await idbGet();if(!d){try{d=JSON.parse(localStorage.getItem('ct_backup_nophotos')||'null')}catch(e){}}if(d){S={...S,...d,settings:{...S.settings,...(d.settings||{})}}}if(!S.settings.catsV2){['Teléfonos','Relojes','Planchas'].forEach(c=>{if(!S.settings.cats.includes(c))S.settings.cats.splice(1,0,c)});S.settings.catsV2=1;save()}if(!S.settings.autoV3){S.settings.rateManual=false;S.settings.eurManual=false;S.settings.autoV3=1;save()}}

/* ===== Cálculos ===== */
const cl=id=>S.clients.find(c=>c.id===id);
const saleTotal=s=>r2(s.items.reduce((a,i)=>a+i.qty*i.price,0));
const saleCost=s=>r2(s.items.reduce((a,i)=>a+i.qty*(i.cost||0),0));
function balance(cid){const b=r2(S.sales.filter(s=>s.clientId===cid).reduce((a,s)=>a+saleTotal(s),0));const p=r2(S.payments.filter(x=>x.clientId===cid).reduce((a,x)=>a+x.amount,0));return{bought:b,paid:p,debt:r2(b-p)}}
const totalDebt=()=>r2(S.clients.reduce((a,c)=>a+Math.max(0,balance(c.id).debt),0));
const rate=()=>+S.settings.rate||0;
const rateMk=()=>r2(rate()*(1+(+S.settings.markup||0)/100));
const eurMk=()=>r2((+S.settings.rateEur||0)*(1+(+S.settings.markup||0)/100));
const CURS=[['USD','$'],['EUR','€'],['Bs','Bs']];
function toUSD(a,c){const u=rateMk(),e=eurMk();if(c==='USD')return a;if(c==='EUR')return u&&e?a*e/u:0;return u?a/u:0}
function fromUSD(a,c){const u=rateMk(),e=eurMk();if(c==='USD')return a;if(c==='EUR')return u&&e?a*u/e:0;return a*u}
const fmtCur=(n,c)=>c==='EUR'?fmtEur(n):c==='Bs'?fmtBs(n):fmt(n);
const eqLine=usd=>rate()?`${fmtBs(usd*rateMk())}${eurMk()?' · '+fmtEur(fromUSD(usd,'EUR')):''}`:'';
const clientName=id=>id?(cl(id)?.name||'(borrado)'):'Mostrador';

/* ===== Tasa BCV automática (tasa.js la escribe ActualizarTasa.ps1) ===== */
function bcvNow(){const T=window.TASAS_BCV;if(!T||!T.actual)return null;
  /* Rige SIEMPRE la última tasa publicada por el BCV, hasta que publique la siguiente
     (la del viernes en la tarde se cobra todo el fin de semana hasta el lunes) */
  const he=[...(T.hist||[])].sort((a,b)=>b.valor.localeCompare(a.valor)).find(x=>x.eur);
  let eur=T.actual.eur||(he?he.eur:0);if(eur&&(eur/T.actual.tasa<0.5||eur/T.actual.tasa>2.5))eur=0;/* valor absurdo = mal leído */
  return{tasa:T.actual.tasa,valor:T.actual.valor,eur}}
const apiFresh=()=>{const a=S.settings.api;return a&&Date.now()-a.at<129600000?a:null};
function applyAuto(){const b=bcvNow(),api=apiFresh();if(S.settings.manualDay&&S.settings.manualDay!==todayISO()){S.settings.rateManual=false;S.settings.eurManual=false}
  if(!S.settings.rateManual){if(b){S.settings.rate=b.tasa;S.settings.rateDate=b.valor}else if(api){S.settings.rate=api.usd;S.settings.rateDate=todayISO()}}
  if(!S.settings.eurManual){if(b&&b.eur)S.settings.rateEur=b.eur;else if(api)S.settings.rateEur=api.eur;else if(S.settings.rateEur&&S.settings.rate&&(S.settings.rateEur/S.settings.rate<0.5||S.settings.rateEur/S.settings.rate>2.5))S.settings.rateEur=0}}
/* Respaldo por internet (solo si tasa.js no trae algo): DolarApi, fuente BCV */
async function apiFallback(){const b=bcvNow();if(b&&b.eur&&b.tasa)return;
  try{const [u,e]=await Promise.all(['dolares','euros'].map(k=>fetch('https://ve.dolarapi.com/v1/'+k+'/oficial',{cache:'no-store'}).then(r=>r.json())));
    const a={usd:+u.promedio||0,eur:+e.promedio||0,at:Date.now()};
    if(a.usd>0&&a.eur>0){const old=S.settings.rate+'|'+S.settings.rateEur;S.settings.api=a;applyAuto();save();if(old!==S.settings.rate+'|'+S.settings.rateEur)render()}}catch(e){}}
function reloadTasa(){const s=document.createElement('script');s.src='tasa.js?t='+Date.now();s.onload=()=>{const a=S.settings.rate+'|'+S.settings.rateEur;applyAuto();s.remove();if(a!==S.settings.rate+'|'+S.settings.rateEur){save();render()}};s.onerror=()=>s.remove();document.head.appendChild(s)}
function bcvStatus(){const T=window.TASAS_BCV,s=S.settings;
  if(!T||!T.actual)return apiFresh()?`<p style="margin-top:0">🔄 Automática por internet (BCV vía ve.dolarapi.com)</p>`:'<p class="y" style="margin-top:0">Buscando la tasa del BCV… necesita internet. Si ya la tenías cargada se usa la última guardada.</p>';
  let t=`<p style="margin-top:0">${(s.rateManual||s.eurManual)?'✋ Tasa escrita a mano':'🔄 Automática desde bcv.org.ve (toma la tasa nueva apenas la publican, entre 4 y 7 pm)'}<br><small class="m">Última captura: ${new Date(T.actual.capturado).toLocaleString('es-VE')}</small></p>`;
  const hh=new Date(),fin=hh.getDay()%6===0;
  if(hh.getHours()>=16&&T.actual.valor<=todayISO()&&!fin)t+='<p class="y" style="margin:0 0 8px">⏳ Esperando la tasa nueva del BCV (se busca cada 30 min desde las 4:00 pm). Mientras tanto se usa la anterior.</p>';
  t+=`<p class="m" style="margin:0 0 8px">Rige la tasa con fecha valor <b>${fshort(T.actual.valor)}</b> hasta que el BCV publique la siguiente (la del viernes en la tarde se cobra todo el fin de semana).</p>`;
  if(!(+s.rateEur))t+='<p class="y" style="margin:0 0 8px">El euro aún no se ha capturado: abre el programa con <b>Abrir Control de Tienda.bat</b> (o espera a las 7:00 pm) y aparece solo.</p>';
  if(s.rateManual||s.eurManual)t+=`<button class="btn s sm" onclick="S.settings.rateManual=false;S.settings.eurManual=false;applyAuto();save();render()" style="margin-bottom:8px">Volver a automática</button>`;
  return t}
/* ===== Navegación ===== */
const TABS=[['inicio','🏠','Inicio'],['ventas','🧾','Ventas'],['clientes','👥','Clientes'],['productos','📦','Productos'],['caja','🔒','Caja'],['reportes','📊','Reportes'],['ajustes','⚙️','Ajustes']];
let tab='inicio',openClient=null,qClient='',qProd='',salesFilter={from:'',to:'',cat:''};
function go(t){tab=t;openClient=null;render();scrollTo(0,0)}
function render(){
  $('#nav').innerHTML=TABS.map(t=>`<button class="${t[0]===tab?'on':''}" onclick="go('${t[0]}')"><b>${t[1]}</b>${t[2]}</button>`).join('');
  $('#storeName').textContent='🛍️ '+(S.settings.store||'Control de Tienda');
  const r=rate();$('#rateTag').textContent=r?`BCV $${r.toFixed(2)}`+(+S.settings.rateEur?` · €${(+S.settings.rateEur).toFixed(2)}`:''):'Poner tasa BCV';
  $('#app').innerHTML=({inicio:vInicio,ventas:vVentas,clientes:vClientes,productos:vProductos,caja:vCaja,reportes:vReportes,ajustes:vAjustes})[tab]();
}

/* ===== Inicio ===== */
function vInicio(){
  const t=todayISO(),ws=weekStart(t),mk=monthKey(t);
  const sum=f=>r2(S.sales.filter(f).reduce((a,s)=>a+saleTotal(s),0));
  const prof=f=>r2(S.sales.filter(f).reduce((a,s)=>a+saleTotal(s)-saleCost(s),0));
  const hoy=sum(s=>s.date===t),sem=sum(s=>s.date>=ws),mes=sum(s=>monthKey(s.date)===mk);
  const gMes=prof(s=>monthKey(s.date)===mk);
  const debtors=S.clients.map(c=>({c,b:balance(c.id)})).filter(x=>x.b.debt>0.009).sort((a,b)=>b.b.debt-a.b.debt).slice(0,6);
  const low=S.products.filter(p=>p.track&&p.stock<=(p.min??2)).slice(0,6);
  const byCat={};S.sales.filter(s=>monthKey(s.date)===mk).forEach(s=>s.items.forEach(i=>{byCat[i.cat]=(byCat[i.cat]||0)+i.qty*i.price}));
  const cats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);const mx=cats[0]?.[1]||1;
  const last=[...S.sales].sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id)).slice(0,5);
  return `<div class="row noprint" style="margin-bottom:12px"><button class="btn" onclick="saleForm()">+ Nueva venta</button><button class="btn s" onclick="payForm()">+ Abono / pago</button><button class="btn s" onclick="clientForm()">+ Cliente</button></div>
  <div class="grid" style="margin-bottom:12px">
   <div class="kpi"><small>Vendido hoy</small><b class="g">${fmt(hoy)}</b></div>
   <div class="kpi"><small>Esta semana</small><b>${fmt(sem)}</b></div>
   <div class="kpi"><small>Este mes</small><b>${fmt(mes)}</b></div>
   <div class="kpi"><small>Ganancia del mes</small><b class="g">${fmt(gMes)}</b></div>
   <div class="kpi"><small>Por cobrar (deudas)</small><b class="r">${fmt(totalDebt())}</b></div>
  </div>
  ${rate()?`<div class="card m">Hoy: ${fmt(hoy)} = <b>${eqLine(hoy)}</b></div>`:''}
  <div class="grid">
   <div class="card"><h2>Quién me debe</h2>${debtors.length?debtors.map(x=>`<div class="item" onclick="showClient('${x.c.id}')"><span>${esc(x.c.name)}</span><b class="r">${fmt(x.b.debt)}</b></div>`).join(''):'<span class="m">Nadie debe nada 🎉</span>'}</div>
   <div class="card"><h2>Ventas del mes por categoría</h2>${cats.length?cats.map(([k,v])=>`<div style="margin-bottom:8px"><div class="row" style="justify-content:space-between"><span>${esc(k)}</span><b class="fix">${fmt(v)}</b></div><div class="bar"><i style="width:${v/mx*100}%"></i></div></div>`).join(''):'<span class="m">Sin ventas este mes</span>'}</div>
  </div>
  <div class="grid">
   <div class="card"><h2>Últimas ventas</h2>${last.length?last.map(s=>`<div class="item" onclick="saleForm('${s.id}')"><span>${fshort(s.date)} · ${esc(clientName(s.clientId))}<br><small class="m">${esc(s.items.map(i=>i.name).join(', ').slice(0,60))}</small></span><b>${fmt(saleTotal(s))}</b></div>`).join(''):'<span class="m">Aún no hay ventas</span>'}</div>
   <div class="card"><h2>Stock bajo</h2>${low.length?low.map(p=>`<div class="item" onclick="prodForm('${p.id}')"><span>${esc(p.name)}</span><b class="y">${p.stock}</b></div>`).join(''):'<span class="m">Sin alertas</span>'}</div>
  </div>`;
}

/* ===== Ventas ===== */
function vVentas(){
  const f=salesFilter;
  let list=[...S.sales].filter(s=>(!f.from||s.date>=f.from)&&(!f.to||s.date<=f.to)&&(!f.cat||s.items.some(i=>i.cat===f.cat))).sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
  const tot=r2(list.reduce((a,s)=>a+saleTotal(s),0));
  return `<div class="row" style="margin-bottom:10px"><button class="btn fix" onclick="saleForm()">+ Nueva venta</button><button class="btn s fix" onclick="importForm()">📋 Pegar cuaderno</button></div>
  <div class="card"><div class="row"><div><label>Desde</label><input type="date" value="${f.from}" onchange="salesFilter.from=this.value;render()"></div><div><label>Hasta</label><input type="date" value="${f.to}" onchange="salesFilter.to=this.value;render()"></div><div><label>Categoría</label><select onchange="salesFilter.cat=this.value;render()"><option value="">Todas</option>${S.settings.cats.map(c=>`<option ${f.cat===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div></div>
  <p class="m" style="margin:8px 0 0">${list.length} ventas · Total ${fmt(tot)}</p></div>
  <div class="card">${list.length?list.map(s=>`<div class="item" onclick="saleForm('${s.id}')"><span><b>${fshort(s.date)}</b> · ${esc(clientName(s.clientId))}<br><small class="m">${esc(s.items.map(i=>(i.qty>1?i.qty+'x ':'')+i.name).join(', ').slice(0,80))}</small></span><b>${fmt(saleTotal(s))}</b></div>`).join(''):'<span class="m">Sin ventas en este filtro</span>'}</div>`;
}
let draft=null;
function saleForm(id){
  const ex=id?S.sales.find(s=>s.id===id):null;
  draft=ex?JSON.parse(JSON.stringify(ex)):{id:uid(),clientId:'',date:todayISO(),items:[{name:'',cat:S.settings.cats[0],qty:1,price:0,cost:0,productId:''}],note:'',payNow:null};
  draft._new=!ex;window._photos=[];drawSale();
}
function drawSale(){
  const d=draft,tot=saleTotal(d);
  const rows=d.items.map((i,k)=>`<div class="irow"><input class="nm" list="plist" placeholder="Producto" value="${esc(i.name)}" onchange="itemName(${k},this.value)"><select onchange="draft.items[${k}].cat=this.value">${S.settings.cats.map(c=>`<option ${i.cat===c?'selected':''}>${esc(c)}</option>`).join('')}</select><input type="number" min="1" step="1" value="${i.qty}" onchange="draft.items[${k}].qty=+this.value||1;drawSale()"><input type="number" step="0.01" placeholder="$" value="${i.price||''}" onchange="draft.items[${k}].price=+this.value||0;drawSale()"><button class="btn d sm fix" onclick="draft.items.splice(${k},1);if(!draft.items.length)draft.items.push({name:'',cat:S.settings.cats[0],qty:1,price:0,cost:0});drawSale()">✕</button></div>`).join('');
  const payNow=d.payNow===null?(d.clientId?0:tot):d.payNow;
  modal(`<h3>${d._new?'Nueva venta':'Editar venta'}</h3>
  <datalist id="plist">${S.products.map(p=>`<option value="${esc(p.name)}">`).join('')}</datalist>
  <div class="row"><div><label>Fecha</label><input type="date" value="${d.date}" onchange="draft.date=this.value"></div>
  <div><label>Cliente (vacío = mostrador)</label><select onchange="draft.clientId=this.value;draft.payNow=null;drawSale()"><option value="">Mostrador (paga al momento)</option>${S.clients.map(c=>`<option value="${c.id}" ${d.clientId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div></div>
  <label>Artículos (producto · categoría · cant. · precio $)</label>${rows}
  <button class="btn s sm" onclick="draft.items.push({name:'',cat:S.settings.cats[0],qty:1,price:0,cost:0});drawSale()">+ Artículo</button>
  <div class="card" style="margin-top:12px"><div class="row" style="justify-content:space-between"><span>Total</span><b class="fix" style="font-size:20px">${fmt(tot)}</b></div>
  ${rate()?`<div class="m">= ${eqLine(tot)}<br><small>a tasa BCV +${S.settings.markup}%</small></div>`:''}
  ${d._new?`<label>Pagó ahora</label><div class="row"><select class="fix" style="width:74px" onchange="draft.payCur=this.value;drawSale()">${CURS.map(([v,t])=>`<option value="${v}" ${(d.payCur||'USD')===v?'selected':''}>${t}</option>`).join('')}</select><input type="number" step="0.01" value="${r2(fromUSD(payNow,d.payCur||'USD'))}" onchange="draft.payNow=toUSD(+this.value||0,draft.payCur||'USD');drawSale()"><button class="btn s sm fix" onclick="draft.payNow=${tot};drawSale()">Todo</button><button class="btn s sm fix" onclick="draft.payNow=0;drawSale()">Fiado</button></div>
  <label>Método de pago</label><select id="pm" onchange="window._pm=this.value">${METHODS.map(m=>`<option ${window._pm===m?'selected':''}>${m}</option>`).join('')}</select>${payNow>0?photoInput():''}
  <p class="m" style="margin:6px 0 0">${r2(tot-payNow)>0.009?'Queda debiendo '+fmt(tot-payNow):'Pagado completo'}</p>`:''}</div>
  <label>Nota</label><input value="${esc(d.note||'')}" onchange="draft.note=this.value">
  <div class="row" style="margin-top:12px"><button class="btn" onclick="saveSale()">Guardar</button>${d._new?'':'<button class="btn d fix" onclick="delSale()">Borrar</button>'}<button class="btn s fix" onclick="closeModal()">Cancelar</button></div>`);
}
function itemName(k,v){const i=draft.items[k];i.name=v;const p=S.products.find(p=>p.name.toLowerCase()===v.toLowerCase());if(p){i.productId=p.id;i.cat=p.cat;i.price=p.price;i.cost=p.cost||0}drawSale()}
function saveSale(){
  const d=draft;d.items=d.items.filter(i=>i.name.trim()&&i.price>0);
  if(!d.items.length)return toast('Agrega al menos un artículo con precio');
  const tot=saleTotal(d);const pcur=d.payCur;delete d.payCur;
  if(d._new){
    d.items.forEach(i=>{const p=S.products.find(p=>p.id===i.productId);if(p&&p.track)p.stock-=i.qty});
    const pn=d.payNow===null?(d.clientId?0:tot):d.payNow;
    if(pn>0)S.payments.push({id:uid(),clientId:d.clientId||null,saleId:d.id,date:d.date,amount:r2(pn),method:$('#pm')?.value||'Efectivo $',note:'Pago en la venta',photos:window._photos.length?window._photos.slice():undefined,orig:pcur&&pcur!=='USD'?{cur:pcur,amt:r2(fromUSD(pn,pcur))}:undefined});
    delete d.payNow;delete d._new;d.ts=Date.now();S.sales.push(d);
  }else{delete d.payNow;delete d._new;const k=S.sales.findIndex(s=>s.id===d.id);S.sales[k]=d}
  save();closeModal();render();toast('Venta guardada')
}
function delSale(){if(!confirm('¿Borrar esta venta? (los pagos ligados también)'))return;S.sales=S.sales.filter(s=>s.id!==draft.id);S.payments=S.payments.filter(p=>p.saleId!==draft.id);save();closeModal();render()}

/* ===== Pagos ===== */
function payForm(cid,pid){
  const ex=pid?S.payments.find(p=>p.id===pid):null;const debt=cid?balance(cid).debt:0;
  window._photos=ex?pPhotos(ex).slice():[];
  modal(`<h3>${ex?'Editar pago':'Abono / pago de cliente'}</h3>
  <label>Cliente</label><select id="pc">${S.clients.map(c=>`<option value="${c.id}" ${(ex?.clientId||cid)===c.id?'selected':''}>${esc(c.name)} (debe ${fmt(balance(c.id).debt)})</option>`).join('')}</select>
  <div class="row"><div><label>Fecha</label><input type="date" id="pd" value="${ex?.date||todayISO()}"></div><div><label>Monto</label><div class="row" style="flex-wrap:nowrap"><select id="pcu" class="fix" style="width:74px" onchange="payCalc()">${CURS.map(([v,t])=>`<option value="${v}" ${(ex?.orig?.cur||'USD')===v?'selected':''}>${t}</option>`).join('')}</select><input type="number" step="0.01" id="pa" oninput="payCalc()" value="${ex?.orig?ex.orig.amt:(ex?.amount||(debt>0?debt:''))}"></div><small class="m" id="peq"></small></div></div>
  <label>Método</label><select id="pmm">${METHODS.map(m=>`<option ${ex?.method===m?'selected':''}>${m}</option>`).join('')}</select>
  <label>Nota</label><input id="pn" value="${esc(ex?.note||'')}">
  ${photoInput()}
  <div class="row" style="margin-top:12px"><button class="btn" onclick="savePay('${pid||''}')">Guardar</button>${ex?`<button class="btn d fix" onclick="delPay('${pid}')">Borrar</button>`:''}<button class="btn s fix" onclick="closeModal()">Cancelar</button></div>`);
}
window._photos=[];
const pPhotos=o=>o.photos||(o.photo?[o.photo]:[]);
function compress(f){return new Promise(res=>{const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const m=1100,k=Math.min(1,m/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.65))};im.onerror=()=>res(null);im.src=rd.result};rd.readAsDataURL(f)})}
async function addPhotos(inp){for(const f of inp.files){const d=await compress(f);if(d)window._photos.push(d)}inp.value='';drawPhotos()}
function drawPhotos(){document.querySelectorAll('.phbox').forEach(e=>e.innerHTML=photoGrid())}
function photoGrid(){return `<div class="ths">${window._photos.map((s,k)=>`<div class="th"><img src="${s}" onclick="viewSrc(window._photos[${k}])"><b onclick="window._photos.splice(${k},1);drawPhotos()">✕</b></div>`).join('')}</div>`}
function viewSrc(s){const v=document.createElement('div');v.className='viewer';v.onclick=()=>v.remove();v.innerHTML=`<img src="${s}">`;document.body.appendChild(v)}
function viewImg(kind,id,k){const o=(kind==='p'?S.payments:S.closes).find(x=>x.id===id);viewSrc(pPhotos(o)[k])}
const photoInput=()=>`<label>Comprobantes / capturas (fotos, puedes subir varias)</label><input type="file" accept="image/*" multiple onchange="addPhotos(this)"><div class="phbox">${photoGrid()}</div>`;
const thumbs=(kind,o)=>pPhotos(o).length?`<div class="ths" onclick="event.stopPropagation()">${pPhotos(o).map((s,k)=>`<div class="th"><img src="${s}" onclick="viewImg('${kind}','${o.id}',${k})"></div>`).join('')}</div>`:'';
function payCalc(){const c=$('#pcu').value,v=+$('#pa').value||0,e=$('#peq');if(!e)return;e.textContent=c==='USD'?(v&&rate()?'≈ '+eqLine(v):''):(toUSD(v,c)?'= '+fmt(toUSD(v,c))+' (tasa BCV +'+S.settings.markup+'%)':'Falta la tasa BCV')}
function savePay(pid){
  const cur=$('#pcu').value,raw=+$('#pa').value||0;const amount=r2(toUSD(raw,cur));if(cur!=='USD'&&raw>0&&!amount)return toast('Falta la tasa BCV (dólar y euro) en Ajustes');if(!(amount>0)||!$('#pc').value)return toast('Elige cliente y monto');
  const o={clientId:$('#pc').value,date:$('#pd').value,amount,method:$('#pmm').value,note:$('#pn').value,photos:window._photos.length?window._photos.slice():undefined,photo:undefined,orig:cur!=='USD'?{cur,amt:r2(raw)}:undefined};
  if(pid){Object.assign(S.payments.find(p=>p.id===pid),o)}else S.payments.push({id:uid(),...o});
  save();closeModal();render();if(openClient)showClient(openClient);toast('Pago guardado')
}
function delPay(id){if(!confirm('¿Borrar pago?'))return;S.payments=S.payments.filter(p=>p.id!==id);save();closeModal();render();if(openClient)showClient(openClient)}

/* ===== Clientes ===== */
function vClientes(){
  if(openClient)return vFicha(openClient);
  const q=qClient.toLowerCase();
  const list=S.clients.filter(c=>!q||(c.name+' '+(c.phone||'')).toLowerCase().includes(q)).map(c=>({c,b:balance(c.id)})).sort((a,b)=>b.b.debt-a.b.debt||a.c.name.localeCompare(b.c.name));
  return `<div class="row" style="margin-bottom:10px"><input placeholder="Buscar cliente…" value="${esc(qClient)}" oninput="qClient=this.value;render();document.activeElement&&0"><button class="btn fix" onclick="clientForm()">+ Cliente</button></div>
  <div class="card">${list.length?list.map(x=>`<div class="item" onclick="showClient('${x.c.id}')"><span><b>${esc(x.c.name)}</b><br><small class="m">${esc(x.c.phone||'')} · compró ${fmt(x.b.bought)}</small></span><b class="${x.b.debt>0.009?'r':'g'}">${x.b.debt>0.009?'Debe '+fmt(x.b.debt):'Al día'}</b></div>`).join(''):'<span class="m">Sin clientes todavía. Pulsa + Cliente.</span>'}</div>`;
}
function showClient(id){tab='clientes';openClient=id;render();scrollTo(0,0)}
function vFicha(id){
  const c=cl(id);if(!c){openClient=null;return vClientes()}
  const b=balance(id);
  const sales=S.sales.filter(s=>s.clientId===id),pays=S.payments.filter(p=>p.clientId===id);
  const days={};sales.forEach(s=>(days[s.date]=days[s.date]||{s:[],p:[]}).s.push(s));pays.forEach(p=>(days[p.date]=days[p.date]||{s:[],p:[]}).p.push(p));
  const ds=Object.keys(days).sort().reverse();
  return `<button class="btn s sm" onclick="openClient=null;render()">← Clientes</button>
  <div class="card" style="margin-top:10px"><div class="row" style="justify-content:space-between"><div><h2 style="margin:0">${esc(c.name)}</h2><span class="m">${esc(c.phone||'')} ${c.notes?'· '+esc(c.notes):''}</span></div><div class="fix"><button class="btn s sm" onclick="clientForm('${id}')">Editar</button></div></div>
   <div class="grid" style="margin-top:10px"><div class="kpi"><small>Total comprado</small><b>${fmt(b.bought)}</b></div><div class="kpi"><small>Pagado</small><b class="g">${fmt(b.paid)}</b></div><div class="kpi"><small>${b.debt<0?'Saldo a favor':'Debe'}</small><b class="${b.debt>0.009?'r':'g'}">${fmt(Math.abs(b.debt))}</b></div></div>
   <div class="row noprint" style="margin-top:10px"><button class="btn fix" onclick="saleFormFor('${id}')">+ Venta</button><button class="btn s fix" onclick="payForm('${id}')">+ Abono</button><button class="btn s fix" onclick="stmt('${id}')">📤 Estado de cuenta</button></div></div>
  ${ds.map(d=>`<div class="day">${fdate(d)}</div>${days[d].s.map(s=>`<div class="item" onclick="saleForm('${s.id}')"><span>${s.items.map(i=>`${i.qty>1?i.qty+'x ':''}${esc(i.name)} <small class="m">${fmt(i.price)}</small>`).join('<br>')}</span><b>${fmt(saleTotal(s))}</b></div>`).join('')}${days[d].p.map(p=>`<div class="item" onclick="payForm('${id}','${p.id}')"><span class="g">💵 Pago · ${esc(p.method)}${p.orig?' · '+fmtCur(p.orig.amt,p.orig.cur):''}${pPhotos(p).length?' 📎'+pPhotos(p).length:''}<br><small class="m">${esc(p.note||'')}</small>${thumbs('p',p)}</span><b class="g">−${fmt(p.amount)}</b></div>`).join('')}`).join('')||'<p class="m">Sin movimientos</p>'}`;
}
function saleFormFor(id){saleForm();draft.clientId=id;draft.payNow=null;drawSale()}
function clientForm(id){
  const c=id?cl(id):{name:'',phone:'',notes:''};
  modal(`<h3>${id?'Editar cliente':'Nuevo cliente'}</h3><label>Nombre</label><input id="cn" value="${esc(c.name)}"><label>Teléfono / WhatsApp</label><input id="cp" value="${esc(c.phone||'')}" placeholder="0414…"><label>Notas</label><input id="cx" value="${esc(c.notes||'')}">
  <div class="row" style="margin-top:12px"><button class="btn" onclick="saveClient('${id||''}')">Guardar</button>${id?`<button class="btn d fix" onclick="delClient('${id}')">Borrar</button>`:''}<button class="btn s fix" onclick="closeModal()">Cancelar</button></div>`);
  setTimeout(()=>$('#cn')?.focus(),50)
}
function saveClient(id){const n=$('#cn').value.trim();if(!n)return toast('Falta el nombre');const o={name:n,phone:$('#cp').value.trim(),notes:$('#cx').value.trim()};if(id)Object.assign(cl(id),o);else S.clients.push({id:uid(),...o,created:todayISO()});save();closeModal();render();if(openClient)showClient(openClient)}
function delClient(id){const b=balance(id);if(!confirm('¿Borrar cliente'+(b.bought?' y TODAS sus ventas y pagos':'')+'?'))return;S.sales=S.sales.filter(s=>s.clientId!==id);S.payments=S.payments.filter(p=>p.clientId!==id);S.clients=S.clients.filter(c=>c.id!==id);openClient=null;save();closeModal();render()}
function stmtText(id){
  const c=cl(id),b=balance(id);const days={};
  S.sales.filter(s=>s.clientId===id).forEach(s=>(days[s.date]=days[s.date]||[]).push(...s.items.map(i=>`${i.qty>1?i.qty+' ':''}${i.name} ${r2(i.qty*i.price)}$`)));
  const pd={};S.payments.filter(p=>p.clientId===id).forEach(p=>(pd[p.date]=pd[p.date]||[]).push(`Pago ${p.method} -${p.amount}$`));
  const all=[...new Set([...Object.keys(days),...Object.keys(pd)])].sort();
  let t=`*${S.settings.store} – Estado de cuenta*\n*${c.name}*\n\n`;
  all.forEach(d=>{t+=`${fdate(d)}\n${[...(days[d]||[]),...(pd[d]||[])].join('\n')}\n––––––––––\n`});
  t+=`\nTotal comprado: ${r2(b.bought)}$\nTotal pagado: ${r2(b.paid)}$\n*${b.debt>0?'Deuda':'Saldo'}: ${r2(Math.abs(b.debt))}$*`;
  if(rate()&&b.debt>0)t+=`\n(${fmtBs(b.debt*rateMk())} a tasa ${rateMk().toFixed(2)})`;
  return t;
}
function stmt(id){const t=stmtText(id),c=cl(id);const ph=(c.phone||'').replace(/\D/g,'').replace(/^0/,'58');
  modal(`<h3>Estado de cuenta</h3><textarea id="stt" rows="14">${esc(t)}</textarea><div class="row" style="margin-top:10px"><button class="btn" onclick="navigator.clipboard.writeText($('#stt').value).then(()=>toast('Copiado'))">Copiar</button>${ph?`<a class="btn s" style="text-decoration:none;text-align:center;padding:9px" target="_blank" href="https://wa.me/${ph}?text=${encodeURIComponent(t)}">WhatsApp</a>`:''}<button class="btn s fix" onclick="closeModal()">Cerrar</button></div>`)}

function vProductos(){
  const q=qProd.toLowerCase();const list=S.products.filter(p=>!q||p.name.toLowerCase().includes(q)).sort((a,b)=>a.cat.localeCompare(b.cat)||a.name.localeCompare(b.name));
  const val=r2(S.products.filter(p=>p.track).reduce((a,p)=>a+p.stock*(p.cost||0),0));
  return `<div class="row" style="margin-bottom:10px"><input placeholder="Buscar producto…" value="${esc(qProd)}" oninput="qProd=this.value;render()"><button class="btn fix" onclick="prodForm()">+ Producto</button></div>
  <div class="card m">Inventario valorado a costo: <b>${fmt(val)}</b></div>
  <div class="card">${list.length?list.map(p=>`<div class="item" onclick="prodForm('${p.id}')"><span><b>${esc(p.name)}</b> <span class="tag">${esc(p.cat)}</span><br><small class="m">Costo ${fmt(p.cost||0)} · Ganas ${fmt(p.price-(p.cost||0))}</small></span><span style="text-align:right"><b>${fmt(p.price)}</b><br>${p.track?`<small class="${p.stock<=(p.min??2)?'y':'m'}">stock ${p.stock}</small>`:''}</span></div>`).join(''):'<span class="m">Aún no hay productos. Agrégalos para autocompletar precio y llevar inventario (opcional).</span>'}</div>`;

function prodForm(id){
  const p=id?S.products.find(x=>x.id===id):{name:'',cat:S.settings.cats[0],cost:0,price:0,stock:0,track:false,min:2};
  modal(`<h3>${id?'Editar producto':'Nuevo producto'}</h3><label>Nombre</label><input id="pn1" value="${esc(p.name)}"><label>Categoría</label><select id="pc1">${S.settings.cats.map(c=>`<option ${p.cat===c?'selected':''}>${esc(c)}</option>`).join('')}</select>
  <div class="row"><div><label>Costo $</label><input type="number" step="0.01" id="pco" value="${p.cost||''}"></div><div><label>Precio venta $</label><input type="number" step="0.01" id="ppr" value="${p.price||''}"></div></div>
  <label><input type="checkbox" id="ptr" style="width:auto" ${p.track?'checked':''}> Llevar inventario (stock)</label>
  <div class="row"><div><label>Stock actual</label><input type="number" id="pst" value="${p.stock||0}"></div><div><label>Avisar si baja de</label><input type="number" id="pmi" value="${p.min??2}"></div></div>
  <div class="row" style="margin-top:12px"><button class="btn" onclick="saveProd('${id||''}')">Guardar</button>${id?`<button class="btn d fix" onclick="S.products=S.products.filter(x=>x.id!=='${id}');save();closeModal();render()">Borrar</button>`:''}<button class="btn s fix" onclick="closeModal()">Cancelar</button></div>`)}
function saveProd(id){const n=$('#pn1').value.trim();if(!n)return toast('Falta el nombre');const o={name:n,cat:$('#pc1').value,cost:+$('#pco').value||0,price:+$('#ppr').value||0,track:$('#ptr').checked,stock:+$('#pst').value||0,min:+$('#pmi').value||0};if(id)Object.assign(S.products.find(x=>x.id===id),o);else S.products.push({id:uid(),...o});save();closeModal();render()}

/* ===== Reportes ===== */
let repMode='mes';
function vResumen(){
  const t=todayISO();let from,label;
  if(repMode==='hoy'){from=t;label='Hoy'}else if(repMode==='semana'){from=weekStart(t);label='Esta semana'}else if(repMode==='mes'){from=t.slice(0,7)+'-01';label='Este mes'}else{from='0000-00-00';label='Todo'}
  const ss=S.sales.filter(s=>s.date>=from),pp=S.payments.filter(p=>p.date>=from);
  const ven=r2(ss.reduce((a,s)=>a+saleTotal(s),0)),cos=r2(ss.reduce((a,s)=>a+saleCost(s),0)),cob=r2(pp.reduce((a,p)=>a+p.amount,0));
  const byCat={};ss.forEach(s=>s.items.forEach(i=>{const o=byCat[i.cat]=byCat[i.cat]||{v:0,c:0,n:0};o.v+=i.qty*i.price;o.c+=i.qty*(i.cost||0);o.n+=i.qty}));
  const byM={};pp.forEach(p=>byM[p.method]=(byM[p.method]||0)+p.amount);
  const byC={};ss.forEach(s=>{const k=clientName(s.clientId);byC[k]=(byC[k]||0)+saleTotal(s)});
  const top=Object.entries(byC).sort((a,b)=>b[1]-a[1]).slice(0,8);
  return `<div class="noprint" style="margin-bottom:10px">${['hoy','semana','mes','todo'].map(m=>`<span class="pill ${repMode===m?'on':''}" onclick="repMode='${m}';render()">${m[0].toUpperCase()+m.slice(1)}</span>`).join('')}<button class="btn s sm" onclick="print()">🖨️ Imprimir</button></div>
  <h2>${label}</h2><div class="grid" style="margin-bottom:12px"><div class="kpi"><small>Vendido</small><b>${fmt(ven)}</b></div><div class="kpi"><small>Cobrado (entró)</small><b class="g">${fmt(cob)}</b></div><div class="kpi"><small>Ganancia estimada</small><b class="g">${fmt(ven-cos)}</b><small>según costos cargados</small></div><div class="kpi"><small>Por cobrar total</small><b class="r">${fmt(totalDebt())}</b></div></div>
  <div class="card"><h2>Por categoría</h2><table><tr><th>Categoría</th><th class="n">Uds</th><th class="n">Vendido</th><th class="n">Ganancia</th></tr>${Object.entries(byCat).sort((a,b)=>b[1].v-a[1].v).map(([k,o])=>`<tr><td>${esc(k)}</td><td class="n">${o.n}</td><td class="n">${fmt(o.v)}</td><td class="n g">${o.c?fmt(o.v-o.c):'—'}</td></tr>`).join('')||'<tr><td colspan=4 class="m">Sin datos</td></tr>'}</table></div>
  <div class="grid"><div class="card"><h2>Cobros por método</h2>${Object.entries(byM).map(([k,v])=>`<div class="item"><span>${esc(k)}</span><b>${fmt(v)}</b></div>`).join('')||'<span class="m">Sin cobros</span>'}</div>
  <div class="card"><h2>Mejores clientes</h2>${top.map(([k,v])=>`<div class="item"><span>${esc(k)}</span><b>${fmt(v)}</b></div>`).join('')||'<span class="m">Sin datos</span>'}</div></div>
  <div class="card noprint"><button class="btn s" onclick="csv()">⬇ Exportar ventas a CSV (Excel)</button></div>`;
}

/* ===== Estadísticas: flujo por día / hora / semana ===== */
let repView='resumen',stDays=90,stMetric='n';
const DN=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'],DS=['LUN','MAR','MIÉ','JUE','VIE','SÁB','DOM'];
const wdIdx=iso=>(parseISO(iso).getDay()+6)%7;
function addDays(iso,n){const d=parseISO(iso);d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function saleHour(s){if(s.note==='Importado del cuaderno')return null;let ts=s.ts;if(!ts){const n=parseInt(String(s.id).slice(0,8),36);if(n>1.6e12&&n<4e12)ts=n}if(!ts)return null;const d=new Date(ts),iso=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');return iso===s.date?d.getHours():null}
function bars(labels,vals,f,cls){const mx=Math.max(...vals,0)||1,best=vals.indexOf(Math.max(...vals));return `<div class="bc ${cls||''}">${vals.map((v,k)=>`<div class="${v>0&&k===best?'best':''}"><span>${v?f(v):''}</span><i style="height:${Math.max(2,Math.round(v/mx*110))}px"></i><b style="font-weight:500">${labels[k]}</b></div>`).join('')}</div>`}
function vFlujo(){
  const t=todayISO(),from=stDays?addDays(t,-stDays+1):'0000-00-00';
  const ss=S.sales.filter(s=>s.date>=from&&s.date<=t);
  const first=ss.length?ss.map(s=>s.date).sort()[0]:t,start=first>from?first:from;
  const occ=Array(7).fill(0);for(let d=start,k=0;d<=t&&k<4000;d=addDays(d,1),k++)occ[wdIdx(d)]++;
  const D=DN.map(()=>({n:0,amt:0,prof:0,cl:new Set(),cats:{}}));
  ss.forEach(s=>{const o=D[wdIdx(s.date)];o.n++;o.amt+=saleTotal(s);o.prof+=saleTotal(s)-saleCost(s);o.cl.add(s.clientId||'m');s.items.forEach(i=>o.cats[i.cat]=(o.cats[i.cat]||0)+i.qty*i.price)});
  const avgN=D.map((o,k)=>occ[k]?o.n/occ[k]:0),avgA=D.map((o,k)=>occ[k]?o.amt/occ[k]:0);
  const vals={n:D.map(o=>o.n),amt:D.map(o=>r2(o.amt)),avg:avgN.map(v=>r2(v))}[stMetric];
  const ff={n:v=>v,amt:v=>'$'+Math.round(v),avg:v=>v.toFixed(1)}[stMetric];
  const bestN=avgN.indexOf(Math.max(...avgN)),bestA=D.map(o=>o.amt).indexOf(Math.max(...D.map(o=>o.amt)));
  const low=ss.length?avgN.map((v,k)=>[v,k]).filter(x=>occ[x[1]]>0).sort((a,b)=>a[0]-b[0])[0][1]:0;
  // horas
  const H=Array(24).fill(0);let hn=0;ss.forEach(s=>{const hr=saleHour(s);if(hr!==null){H[hr]++;hn++}});
  const hr0=Math.max(8,Math.min(...H.map((v,k)=>v?k:99),23)),hr1=Math.min(22,Math.max(...H.map((v,k)=>v?k:-1),hr0+6));
  const hl=[],hv=[];for(let k=hr0;k<=hr1;k++){hl.push((k%12||12)+(k<12?'a':'p'));hv.push(H[k])}
  // semanas
  const ws=weekStart(t),W=[],WL=[];for(let k=7;k>=0;k--){const a=addDays(ws,-7*k),b=addDays(a,6);W.push(r2(S.sales.filter(s=>s.date>=a&&s.date<=b).reduce((x,s)=>x+saleTotal(s),0)));WL.push(a.slice(8)+'/'+a.slice(5,7))}
  const topCat=o=>{const e=Object.entries(o.cats).sort((a,b)=>b[1]-a[1])[0];return e?e[0]:'—'};
  return `<div class="noprint" style="margin-bottom:10px"><span class="pill ${stDays?'':'on'}" onclick="stDays=0;render()">Todo</span>${[30,90,180].map(d=>`<span class="pill ${stDays===d?'on':''}" onclick="stDays=${d};render()">${d} días</span>`).join('')}</div>
  ${ss.length<3?'<div class="card y">Todavía hay pocas ventas en este período para sacar conclusiones. Mientras más ventas registres (o importes del cuaderno), más exactas serán las estadísticas.</div>':''}
  <div class="grid" style="margin-bottom:12px"><div class="kpi"><small>🏆 Día con más flujo</small><b class="g">${ss.length?DN[bestN]:'—'}</b><small>${ss.length?avgN[bestN].toFixed(1)+' ventas por cada '+DN[bestN].toLowerCase()+' · '+D[bestN].n+' en total':''}</small></div>
   <div class="kpi"><small>💰 Día que más vende ($)</small><b class="g">${ss.length?DN[bestA]:'—'}</b><small>${ss.length?fmt(D[bestA].amt)+' en total · '+fmt(avgA[bestA])+' por día':''}</small></div>
   <div class="kpi"><small>😴 Día más flojo</small><b class="y">${ss.length?DN[low]:'—'}</b><small>${ss.length?avgN[low].toFixed(1)+' ventas por día':''}</small></div></div>
  <div class="card"><div class="noprint" style="margin-bottom:4px">${[['n','Nº de ventas'],['amt','Monto $'],['avg','Promedio por día']].map(([v,l])=>`<span class="pill ${stMetric===v?'on':''}" onclick="stMetric='${v}';render()">${l}</span>`).join('')}</div>
   <h2 style="margin-bottom:0">Flujo por día de la semana</h2>${bars(DS,vals,ff)}
   <p class="m" style="margin:0;font-size:12px">"Promedio por día" reparte entre cuántos lunes, martes… hubo en el período, para que sea justo.</p></div>
  <div class="card"><h2>Detalle por día</h2><table><tr><th>Día</th><th class="n">Ventas</th><th class="n">Clientes</th><th class="n">Vendido</th><th class="n">Ganancia</th></tr>${D.map((o,k)=>`<tr><td><b>${DN[k]}</b><br><small class="m">más vende: ${esc(topCat(o))}</small></td><td class="n">${o.n}</td><td class="n">${o.cl.size}</td><td class="n">${fmt(o.amt)}</td><td class="n g">${fmt(o.prof)}</td></tr>`).join('')}</table></div>
  <div class="card"><h2>Horas con más movimiento</h2>${hn>=5?bars(hl,hv,v=>v,'sm')+`<p class="m" style="margin:0;font-size:12px">Basado en ${hn} ventas registradas con su hora.</p>`:'<span class="m">La hora se guarda con cada venta nueva que registres. Cuando haya algunas más, aquí verás en qué horas se mueve más la tienda.</span>'}</div>
  <div class="card"><h2>Últimas 8 semanas (vendido $)</h2>${bars(WL,W,v=>'$'+Math.round(v),'sm')}</div>`;
}
function vReportes(){
  const sw=`<div class="noprint" style="margin-bottom:12px"><span class="pill ${repView==='resumen'?'on':''}" onclick="repView='resumen';render()">📊 Resumen</span><span class="pill ${repView==='flujo'?'on':''}" onclick="repView='flujo';render()">📈 Estadísticas</span></div>`;
  return sw+(repView==='flujo'?vFlujo():vResumen())}
function csv(){let r=[['Fecha','Cliente','Producto','Categoria','Cantidad','Precio','Subtotal','Costo']];S.sales.forEach(s=>s.items.forEach(i=>r.push([s.date,clientName(s.clientId),i.name,i.cat,i.qty,i.price,r2(i.qty*i.price),i.cost||0])));dl('ventas.csv','﻿'+r.map(x=>x.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\n'),'text/csv')}

function restore(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.sales||!d.clients)throw 0;if(!confirm('Esto reemplaza los datos actuales. ¿Continuar?'))return;S={...S,...d,settings:{...S.settings,...(d.settings||{})}};save();render();toast('Restaurado')}catch(e){toast('Archivo inválido')}};r.readAsText(f)}

/* ===== Pegar cuaderno (formato WhatsApp) ===== */
const KW=[['Teléfonos',/tel[eé]f|infinix|infini|celular|iphone|samsung|xiaomi|tecno|redmi|motorola/i],['Relojes',/reloj|smart ?watch|watch/i],['Planchas',/plancha|alisador|secador|rizador/i],['Electrónicos',/power ?bank|cargador|aud[ií]fon|cable|tablet|bocina|parlante|licuadora|freidora|consola/i],['Perfumes',/perfum|colonia|fragan|body ?splash/i],['Trajes de baño',/traje de ba|trae de ba|bikini|ba[ñn]ador|conjunto de playa|short de ba/i],['Ropa interior',/boxer|franela|chemise|pasamonta|squini|medias|panty|brasier/i],['Calzado',/zapato|sandalia|tenis|zapatilla|bota|crocs/i],['Ropa',/vestido|short|shor|pantal|jean|camis|blusa|aquini|conjunto|falda|sueter|chaqueta/i]];
function guessCat(n){for(const [c,re] of KW)if(re.test(n)&&S.settings.cats.includes(c))return c;return S.settings.cats.includes('Otros')?'Otros':S.settings.cats[0]}
function parseNotebook(txt){
  const out=[];let cur=null;
  txt.split(/\r?\n/).forEach(l=>{
    l=l.trim();if(!l||/^[-–—_\s]+$/.test(l)||/total general/i.test(l))return;
    const dm=l.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    if(dm&&!/\$/.test(l)){cur={date:dm[3]+'-'+dm[2].padStart(2,'0')+'-'+dm[1].padStart(2,'0'),items:[]};out.push(cur);return}
    const m=l.match(/^(.*?)[\s:]*(\d+(?:[.,]\d+)?)\s*\$?\s*$/);
    if(m&&/\$/.test(l)||m&&m[1]){if(!m||!m[1].trim())return;if(!cur){cur={date:todayISO(),items:[]};out.push(cur)}
      let name=m[1].replace(/[-–—_\s]+$/,'').trim();let qty=1;const q=name.match(/^(\d+)\s+(.*)$/);if(q&&!/^\d+$/.test(q[2])){qty=+q[1];name=q[2]}
      const total=+m[2].replace(',','.');cur.items.push({name,cat:guessCat(name),qty,price:r2(total/qty),cost:0})}
  });
  return out.filter(d=>d.items.length);
}

  modal(`<h3>Pegar cuaderno de un cliente</h3><p class="m" style="margin-top:0">Pega el texto de WhatsApp (fechas y artículos con precio, como lo llevabas). Se crea una venta por día.</p>
  <label>Cliente</label><select id="ic"><option value="">— elegir —</option>${S.clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select>
  <label>Texto</label><textarea id="it" rows="10" placeholder="Martes 27/10/2026&#10;Traje de baño 2p unicolor 18$&#10;——————&#10;Viernes 30/10/2026&#10;Traje de baño 18$"></textarea>

function impPrev(){
  impDays=parseNotebook($('#it').value);const tot=r2(impDays.reduce((a,d)=>a+d.items.reduce((x,i)=>x+i.qty*i.price,0),0));
  $('#iprev').innerHTML=impDays.length?`<div class="card" style="margin-top:10px">${impDays.map(d=>`<div class="day">${fdate(d.date)}</div>${d.items.map(i=>`<div class="row" style="justify-content:space-between"><span>${i.qty>1?i.qty+'x ':''}${esc(i.name)} <span class="tag">${esc(i.cat)}</span></span><b class="fix">${fmt(i.qty*i.price)}</b></div>`).join('')}`).join('')}<p><b>Total: ${fmt(tot)}</b></p><button class="btn" onclick="impGo()">Importar</button></div>`:'<p class="r">No se reconoció nada. Revisa el formato.</p>'}
function impGo(){
  const cid=$('#ic').value;if(!cid)return toast('Elige el cliente');
  impDays.forEach(d=>{const s={id:uid(),clientId:cid,date:d.date,items:d.items,note:'Importado del cuaderno'};S.sales.push(s);if($('#ip').checked)S.payments.push({id:uid(),clientId:cid,saleId:s.id,date:d.date,amount:saleTotal(s),method:'Efectivo $',note:'Importado'})});

/* ===== Caja / cierre ===== */
let cajaDate=todayISO();
function dayData(d){
  const ss=S.sales.filter(s=>s.date===d),pp=S.payments.filter(p=>p.date===d);
  const by={};METHODS.forEach(m=>by[m]=0);pp.forEach(p=>by[p.method]=r2((by[p.method]||0)+p.amount));
  return{sold:r2(ss.reduce((a,s)=>a+saleTotal(s),0)),n:ss.length,cobrado:r2(pp.reduce((a,p)=>a+p.amount,0)),by,pagos:pp.length,
    fiado:r2(ss.reduce((a,s)=>a+saleTotal(s),0)-pp.filter(p=>p.saleId&&ss.some(s=>s.id===p.saleId)).reduce((a,p)=>a+p.amount,0))}
}
const closeOf=d=>S.closes.find(c=>c.date===d);

  <table style="margin-top:10px"><tr><th>Método</th><th class="n">Cobrado</th></tr>${METHODS.filter(m=>x.by[m]).map(m=>`<tr><td>${m}</td><td class="n">${fmt(x.by[m])}</td></tr>`).join('')||'<tr><td colspan=2 class="m">Sin cobros este día</td></tr>'}</table>
  <div class="row" style="margin-top:12px"><button class="btn" onclick="closeForm('${d}')">${c?'✏️ Editar cierre':'🔒 Hacer cierre de caja'}</button>${c?`<button class="btn s" onclick="showClose('${c.id}')">Ver cierre</button>`:''}</div>

}
function closeForm(d){

  modal(`<h3>Cierre de caja · ${fdate(d)}</h3>

  <div class="card" style="margin-top:8px"><div class="row" style="justify-content:space-between"><span>Diferencia total</span><b class="fix" id="cdt" style="font-size:18px"></b></div></div>

function calcClose(){
  const x=window._cx,fo=+$('#cfo').value||0,ga=+$('#cga').value||0;let tot=0;
  METHODS.forEach((m,k)=>{const exp=r2((x.by[m]||0)+(m==='Efectivo $'?fo-ga:0));$('#ce'+k).textContent='esp. '+fmt(exp);const v=$('#cc'+k).value;const dEl=$('#cd'+k);
    if(v===''){dEl.textContent=exp?'—':'';dEl.className='fix';return}const df=r2(+v-exp);tot+=df;dEl.textContent=(df>0?'+':'')+fmt(df);dEl.className='fix '+(Math.abs(df)<0.01?'g':df<0?'r':'y')});
  const e=$('#cdt');e.textContent=Math.abs(tot)<0.01?'Cuadra ✔':(tot>0?'Sobra ':'Falta ')+fmt(Math.abs(tot));e.className='fix '+(Math.abs(tot)<0.01?'g':tot<0?'r':'y');
}
function saveClose(d){
  const by=$('#cby').value.trim();if(!by)return toast('Escribe el nombre del encargado');
  const x=dayData(d),fo=+$('#cfo').value||0,ga=+$('#cga').value||0,counted={},expected={},diff={};let tot=0;
  METHODS.forEach((m,k)=>{const exp=r2((x.by[m]||0)+(m==='Efectivo $'?fo-ga:0));expected[m]=exp;const v=$('#cc'+k).value;if(v!==''){counted[m]=r2(+v);diff[m]=r2(+v-exp);tot+=diff[m]}});
  const o={date:d,by,fondo:fo,gastos:ga,counted,expected,diff,diffTotal:r2(tot),sold:x.sold,n:x.n,cobrado:x.cobrado,fiado:Math.max(0,x.fiado),debtTotal:totalDebt(),note:$('#cno').value.trim(),photos:window._photos.length?window._photos.slice():undefined,savedAt:new Date().toISOString()};
  S.settings.admin=by;const ex=closeOf(d);if(ex)Object.assign(ex,o,{photos:o.photos});else S.closes.push({id:uid(),...o});
  save();closeModal();render();toast('Cierre guardado')
}
function closeText(c){
  let t=`*${S.settings.store} – Cierre de caja*\n${fdate(c.date)}\nEncargado: ${c.by}\n\nVendido: ${c.sold}$ (${c.n} ventas)\nCobrado: ${c.cobrado}$\nFiado del día: ${c.fiado}$\nPor cobrar total: ${c.debtTotal}$\n`;
  if(c.fondo||c.gastos)t+=`Fondo inicial: ${c.fondo}$ · Gastos/retiros: ${c.gastos}$\n`;
  t+=`\n*Por método (esperado → contado)*\n`;METHODS.forEach(m=>{if(c.expected[m]||c.counted[m]!==undefined)t+=`${m}: ${c.expected[m]}$ → ${c.counted[m]??'sin contar'}${c.counted[m]!==undefined?' ('+(c.diff[m]>0?'+':'')+c.diff[m]+'$)':''}\n`});
  t+=`\n*${Math.abs(c.diffTotal)<0.01?'Caja cuadrada ✔':(c.diffTotal>0?'Sobra ':'Falta ')+Math.abs(c.diffTotal)+'$'}*`;if(c.note)t+=`\nObs: ${c.note}`;return t}
function showClose(id){const c=S.closes.find(x=>x.id===id);if(!c)return;
  modal(`<h3>Cierre · ${fdate(c.date)}</h3><textarea id="cst" rows="14" readonly>${esc(closeText(c))}</textarea>${pPhotos(c).length?`<label>Capturas (${pPhotos(c).length})</label>${thumbs('c',c)}`:''}
  <div class="row" style="margin-top:10px"><button class="btn" onclick="navigator.clipboard.writeText($('#cst').value).then(()=>toast('Copiado'))">Copiar</button><button class="btn s fix" onclick="cajaDate='${c.date}';closeForm('${c.date}')">Editar</button><button class="btn d fix" onclick="if(confirm('¿Borrar cierre?')){S.closes=S.closes.filter(x=>x.id!=='${c.id}');save();closeModal();render()}">Borrar</button><button class="btn s fix" onclick="closeModal()">Cerrar</button></div>`)}


/* ===== Calculadora dólar / euro / bolívares ===== */
let calcS={amt:'',from:'USD',mk:true};
const fmtEur=n=>'€'+r2(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
function calcRates(){const m=calcS.mk?1+(+S.settings.markup||0)/100:1;return{USD:rate()*m,EUR:(+S.settings.rateEur||0)*m}}
function calcForm(){
  modal(`<h3>🧮 Calculadora BCV</h3>
  <div class="row"><div><label>Monto</label><input type="number" step="0.01" id="cam" value="${calcS.amt}" placeholder="0" oninput="calcS.amt=this.value;calcOut()"></div><div class="fix" style="min-width:110px"><label>Moneda</label><select onchange="calcS.from=this.value;calcOut()">${[['USD','Dólares $'],['EUR','Euros €'],['Bs','Bolívares']].map(([v,t])=>`<option value="${v}" ${calcS.from===v?'selected':''}>${t}</option>`).join('')}</select></div></div>
  <div style="margin:8px 0">${[10,50,100,500,1000].map(v=>`<span class="pill" onclick="$('#cam').value=${v};calcS.amt=${v};calcOut()">${v}</span>`).join('')}</div>
  <label><input type="checkbox" style="width:auto" ${calcS.mk?'checked':''} onchange="calcS.mk=this.checked;calcOut()"> Sumar ${S.settings.markup}% a la tasa BCV</label>
  <div id="cout"></div><div class="row" style="margin-top:12px"><button class="btn s fix" onclick="closeModal()">Cerrar</button></div>`);
  calcOut();setTimeout(()=>$('#cam')?.focus(),50)}
function calcOut(){
  const r=calcRates(),amt=+calcS.amt||0,f=calcS.from;let h='';
  if(!r.USD||(!r.EUR&&f!=='USD'))h+=`<p class="y">Falta la tasa del ${!r.USD?'dólar':'euro'}. Ponla en Ajustes o abre el programa con el .bat para capturarla.</p>`;
  const bs=f==='Bs'?amt:amt*(r[f]||0);
  const rows=[['Bs',fmtBs(bs)],['USD',r.USD?fmt(bs/r.USD):'—'],['EUR',r.EUR?fmtEur(bs/r.EUR):'—']];
  h+=`<div class="card" style="margin-top:10px">${rows.map(([k,v])=>`<div class="row" style="justify-content:space-between;${k===f?'opacity:.55':''}"><span>${k==='Bs'?'Bolívares':k==='USD'?'Dólares':'Euros'}</span><b class="fix" style="font-size:19px">${v}</b></div>`).join('')}</div>`;
  h+=`<p class="m" style="margin:0">Tasas usadas${calcS.mk?' (+'+S.settings.markup+'%)':''}: $ <b>${r.USD.toFixed(2)}</b>${r.EUR?` · € <b>${r.EUR.toFixed(2)}</b> · 1 € = ${(r.EUR/r.USD).toFixed(4)} $`:''}<br>Tasa BCV del ${S.settings.rateDate?fshort(S.settings.rateDate):'día'}${(S.settings.rateManual||S.settings.eurManual)?' · escrita a mano':''}</p>`;
  $('#cout').innerHTML=h}

/* ===== Modal ===== */
function modal(h){$('#modalRoot').innerHTML=`<div class="modal" onmousedown="if(event.target===this)closeModal()"><div>${h}</div></div>`}
function closeModal(){$('#modalRoot').innerHTML=''}

/* ===== Inicio ===== */
load().then(()=>{applyAuto();render();apiFallback();setInterval(apiFallback,1800000);setInterval(reloadTasa,600000);addEventListener('focus',reloadTasa);if(!S.clients.length&&!S.sales.length&&!localStorage.getItem('ct_seen')){localStorage.setItem('ct_seen','1');toast('Empieza creando un cliente o una venta')}});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
