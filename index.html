const CH='0123456789ABCDEFGHJKMNPQRSTVWXYZ',te=new TextEncoder(),td=new TextDecoder();
const g=id=>document.getElementById(id);
class LErr extends Error{}
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const unb64u=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return unb64(s)};
const chk=id=>{let h=0;for(const c of id)h=(h*31+CH.indexOf(c))%1048576;let s='';for(let i=0;i<4;i++){s=CH[h%32]+s;h=Math.floor(h/32)}return s};
const newId=()=>{let id='';for(const x of crypto.getRandomValues(new Uint8Array(12)))id+=CH[x%32];return id+chk(id)};
const fmtId=id=>id.match(/.{1,4}/g).join('-');
const normId=s=>String(s||'').toUpperCase().replace(/[^0-9A-Z]/g,'').replace(/O/g,'0').replace(/[IL]/g,'1');
const fdate=ms=>{const d=new Date(ms);return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear()};

/* almacenamiento doble: localStorage + IndexedDB */
const idb=()=>new Promise(r=>{try{const q=indexedDB.open('ct_lic',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
async function kvGet(k){let v=null;try{v=localStorage.getItem(k)}catch(e){}if(v)return v;const d=await idb();if(!d)return null;return new Promise(r=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)})}
async function kvSet(k,v){try{localStorage.setItem(k,v)}catch(e){}const d=await idb();if(d)await new Promise(r=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=r;t.onerror=r})}
async function getDid(){let id=await kvGet('ct_did');if(!id||id.length!==16||chk(id.slice(0,12))!==id.slice(12)){id=newId();await kvSet('ct_did',id)}else await kvSet('ct_did',id);return id}

/* verificación: firma ECDSA + dispositivo + vencimiento */
async function verify(tok,did){
  const parts=String(tok||'').replace(/\s+/g,'').split('.');
  if(parts.length!==2||!parts[0]||!parts[1])throw new LErr('El token está incompleto. Cópialo completo, tal como te lo enviaron.');
  let o,ok=false;
  try{
    const key=await crypto.subtle.importKey('jwk',PUB,{name:'ECDSA',namedCurve:'P-256'},false,['verify']);
    ok=await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},key,unb64u(parts[1]),unb64u(parts[0]));
    if(ok)o=JSON.parse(td.decode(unb64u(parts[0])));
  }catch(e){ok=false}
  if(!ok||!o)throw new LErr('Token no válido. Revisa que esté completo y sin cambios.');
  if(normId(o.d)!==did)throw new LErr('Este token fue emitido para otro dispositivo y no funciona aquí. Pide uno nuevo con el código de este dispositivo.');
  if(o.e){
    const seen=+(await kvGet('ct_seen'))||0;
    if(seen&&Date.now()<seen-864e5)throw new LErr('La fecha de este dispositivo parece alterada. Corrígela para continuar.');
    if(Date.now()>o.e)throw new LErr('Tu licencia venció el '+fdate(o.e)+'. Pide tu renovación.');
    await kvSet('ct_seen',String(Math.max(seen,Date.now())));
  }
  return o;
}
async function unwrap(o,did){
  const wk=await crypto.subtle.digest('SHA-256',te.encode(did+'|'+PEPPER));
  const key=await crypto.subtle.importKey('raw',wk,'AES-GCM',false,['decrypt']);
  const w=unb64u(o.w);
  return crypto.subtle.decrypt({name:'AES-GCM',iv:w.slice(0,12)},key,w.slice(12));
}
async function decryptApp(K){
  const key=await crypto.subtle.importKey('raw',K,'AES-GCM',false,['decrypt']);
  const all=unb64(PAY);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:all.slice(0,12)},key,all.slice(12));
  return JSON.parse(td.decode(pt));
}

/* arranque de la app ya descifrada */
function start(app,o,did){
  window.__LIC={n:o.n,e:o.e||0,d:fmtId(did),i:o.i};
  g('appcss').textContent=app.css;
  g('gate').remove();
  g('appRoot').innerHTML=app.body;
  const s=document.createElement('script');s.textContent=app.js;document.body.appendChild(s);
  if(o.e)setInterval(async()=>{await kvSet('ct_seen',String(Math.max(+(await kvGet('ct_seen'))||0,Date.now())));if(Date.now()>o.e)location.reload()},60000);
  try{if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
}

/* pantalla de inicio / activación */
function copy(t){return navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()}
function gateUI(did,msg){
  const id=fmtId(did);
  g('gate').innerHTML=`<div class="gbox">
    <svg class="glogo" viewBox="0 0 100 100"><rect width="100" height="100" rx="22" fill="#22c55e"/><path d="M30 38h40l4 40H26z" fill="#fff"/><path d="M38 44v-6a12 12 0 0 1 24 0v6" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/></svg>
    <h1>Control de Tienda</h1>
    <p class="gm">Para usar la app necesitas una <b>licencia personal</b>. Se activa con un token que funciona únicamente en este dispositivo.</p>
    <div class="gs"><b>1. Tu código de dispositivo</b><div class="gid" id="gid">${id}</div>
      <div class="grow"><button class="gb2" id="gcp">Copiar código</button><button class="gb2" id="gsh">Compartir</button></div>
      <small>Envía este código a quien te vende la licencia para que te genere tu token.</small></div>
    <div class="gs"><b>2. Pega tu token de activación</b>
      <textarea id="gtk" rows="4" placeholder="Pega aquí tu token…" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
      <div class="grow"><button class="gb2" id="gps">Pegar</button><button class="gb" id="gac">Activar</button></div>
      <div id="gms" class="${msg?'ger':''}">${msg?msg.replace(/</g,'&lt;'):''}</div></div>
    <small class="gf">Cada token es de un solo dispositivo: si lo compartes con otra persona, no podrá usarlo.</small></div>`;
  const note=(t,ok)=>{const e=g('gms');e.textContent=t;e.className=ok?'gok':'ger'};
  g('gcp').onclick=()=>copy(id).then(()=>note('Código copiado ✔',true),()=>{const r=document.createRange();r.selectNodeContents(g('gid'));const s=getSelection();s.removeAllRanges();s.addRange(r);note('Selecciona y copia el código')});
  g('gsh').onclick=()=>{const t='Mi código de dispositivo para Control de Tienda: '+id;if(navigator.share)navigator.share({text:t}).catch(()=>{});else copy(t).then(()=>note('Código copiado ✔',true),()=>{})};
  g('gps').onclick=()=>navigator.clipboard&&navigator.clipboard.readText?navigator.clipboard.readText().then(t=>{g('gtk').value=t.trim()},()=>note('No se pudo pegar: mantén presionado en el recuadro y elige Pegar')):note('Mantén presionado en el recuadro y elige Pegar');
  g('gac').onclick=async()=>{
    const tok=g('gtk').value.trim();if(!tok)return note('Pega primero tu token');
    g('gac').disabled=true;g('gac').textContent='Verificando…';
    try{const o=await verify(tok,did);const K=await unwrap(o,did);const app=await decryptApp(K);await kvSet('ct_tok',tok.replace(/\s+/g,''));start(app,o,did)}
    catch(e){note(e instanceof LErr?e.message:'Token no válido. Revisa que esté completo.');g('gac').disabled=false;g('gac').textContent='Activar'}
  };
}

async function boot(){
  if(!(window.crypto&&crypto.subtle)){g('gate').innerHTML='<div class="gbox"><h1>Control de Tienda</h1><p class="gm">Abre la app desde su enlace seguro (https) para poder activarla.</p></div>';return}
  const did=await getDid();
  const tok=await kvGet('ct_tok');
  if(tok){
    try{const o=await verify(tok,did);const K=await unwrap(o,did);const app=await decryptApp(K);start(app,o,did);return}
    catch(e){gateUI(did,e instanceof LErr?e.message:'Tu licencia no pudo verificarse. Vuelve a pegar tu token.');return}
  }
  gateUI(did);
}
boot();
})();
</script></body></html>
